<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LoopIQ</title>
  <script>
    // GitHub Pages SPA redirect — from https://github.com/rafgraph/spa-github-pages
    // Keep 1 path segment so /LoopIQ is preserved as the base.
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.host +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
